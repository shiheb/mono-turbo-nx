name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Clear Nx cache
      - run: npx nx reset

      # Debug step: Check nx.json content
      - name: Debug nx.json configuration
        run: |
          echo "=== Current nx.json content ==="
          cat nx.json | jq '.projects'
          echo "=== Directory structure ==="
          ls -la
          echo "=== frontend-e2e directory ==="
          ls -la frontend-e2e/ || echo "frontend-e2e directory not found"
          echo "=== Nx projects detection ==="
          npx nx show projects || echo "Failed to show projects"

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ github.sha }}
          restore-keys: |
            nx-cache-

      - run: npx nx graph --file=project-graph.json
      - run: npx nx run-many -t lint test build typecheck --skip-nx-cache

      - run: npx nx fix-ci
        if: always()
